name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build
        run: go build ./cmd/terraform-mcp-analyzer
      - name: Test
        run: go test ./...
      - name: JSON output schema smoke test
        run: |
          ./terraform-mcp-analyzer scan examples/terraform/iam-v5-to-v6 --pack rules_samples/aws_iam_v5_to_v6.jsonl --format json > out.json || ./bin/terraform-mcp-analyzer scan examples/terraform/iam-v5-to-v6 --pack rules_samples/aws_iam_v5_to_v6.jsonl --format json > out.json
          jq -e '.pack.id and (.summary.total|type=="number") and (.findings|type=="array")' out.json
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

  smoke-matrix:
    name: Smoke tests (multi-OS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build terraform-mcp-analyzer
        run: |
          go build -o ./bin/terraform-mcp-analyzer ./cmd/terraform-mcp-analyzer
      - name: Version check
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then ./bin/terraform-mcp-analyzer.exe version || ./bin/terraform-mcp-analyzer version; else ./bin/terraform-mcp-analyzer version; fi
      - name: Sample scan
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/terraform-mcp-analyzer
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=./bin/terraform-mcp-analyzer.exe; fi
          $BIN scan --pack rules_samples/aws_iam_v5_to_v6.jsonl --format json examples/terraform/iam-v5-to-v6 > out.json || true
          # Validate minimal JSON shape
          if command -v jq >/dev/null 2>&1; then jq -e '.summary.total | type=="number"' out.json; fi
